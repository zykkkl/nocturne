name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::缺少仓库 Secret RELEASE_KEYSTORE_BASE64"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > release.jks
          test -s release.jks

      - name: Build release APK
        env:
          RELEASE_STORE_FILE: release.jks
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          VERSION_NAME="${GITHUB_REF_NAME#v}"
          VERSION_CODE=$((100000 + GITHUB_RUN_NUMBER))
          echo "building 夜航 $VERSION_NAME ($VERSION_CODE)"
          ./gradlew :app:assembleRelease \
            -PversionName="$VERSION_NAME" \
            -PversionCode="$VERSION_CODE"

      - name: Verify signature
        run: |
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs app/build/outputs/apk/release/app-release.apk

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: nocturne-release
          path: app/build/outputs/apk/release/app-release.apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/app-release.apk
          name: 夜航 ${{ github.ref_name }}
          body: |
            夜航 ${{ github.ref_name }} 正式签名安装包。

            安装 / 升级：下载 `app-release.apk` 直接安装。同一签名、更高 versionCode 会覆盖升级，保留本机学习数据与 API 配置。

            注意：Release 包名是 `com.nocturne.learn`，与 debug 包 `com.nocturne.learn.debug` 不同，两者可并存；从 debug 切到 release 不会继承旧数据。
          draft: false
          prerelease: false
